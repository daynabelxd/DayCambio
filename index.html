<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayCambio - Divisas y Comisiones</title>
  
  <!-- Configuración PWA e Icono Neón 'D' -->
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DayCambio">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d1117'/><path d='M30 20 H55 C70 20 80 32 80 50 C80 68 70 80 55 80 H30 Z M42 32 V68 H54 C63 68 68 60 68 50 C68 40 63 32 54 32 Z' fill='%2300ff88'/><path d='M48 42 L58 42 L52 36 M52 58 L42 58 L48 64' stroke='%2300ff88' stroke-width='3' fill='none'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d1117'/><path d='M30 20 H55 C70 20 80 32 80 50 C80 68 70 80 55 80 H30 Z M42 32 V68 H54 C63 68 68 60 68 50 C68 40 63 32 54 32 Z' fill='%2300ff88'/></svg>">

  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --accent: #00ff88;
      --text: #ffffff;
      --subtext: #8b949e;
      --border: #30363d;
      --input-bg: #0d1117;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px 10px; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; }
    
    header { text-align: center; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .logo-icon { width: 44px; height: 44px; background: #00ff8822; border: 2px solid var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; color: var(--accent); box-shadow: 0 0 15px rgba(0,255,136,0.3); }
    h1 { font-size: 26px; font-weight: 800; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--subtext); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }

    .rates-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-bottom: 16px; }
    .rate-box { background: var(--input-bg); border: 1px solid var(--border); padding: 12px 6px; border-radius: 12px; }
    .rate-label { font-size: 11px; color: var(--subtext); margin-bottom: 4px; }
    .rate-val { font-size: 16px; font-weight: 700; color: var(--text); }

    .btn-main { width: 100%; padding: 14px; background: var(--accent); color: #000; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; font-size: 15px; transition: opacity 0.2s; }
    .btn-main:active { opacity: 0.8; }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 12px; background: var(--card-bg); border: 1px solid var(--border); color: var(--subtext); font-weight: 600; border-radius: 12px; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .input-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: var(--subtext); margin-bottom: 8px; }
    input, select { width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }

    .res-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed var(--border); }
    .res-row:last-child { border-bottom: none; }
    .res-val { font-weight: 700; color: var(--accent); }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="logo-icon">D</div>
    <h1>DayCambio</h1>
  </header>

  <!-- BLOQUE DE TASAS -->
  <div class="card">
    <div class="section-title">TASAS OFICIALES & P2P (VES)</div>
    <div class="rates-grid">
      <div class="rate-box"><div class="rate-label">USD BCV</div><div class="rate-val" id="r-usd">--,--</div></div>
      <div class="rate-box"><div class="rate-label">EUR BCV</div><div class="rate-val" id="r-eur">--,--</div></div>
      <div class="rate-box"><div class="rate-label">USDT</div><div class="rate-val" id="r-usdt">--,--</div></div>
    </div>
    <button class="btn-main" onclick="fetchRates()">🔄 Actualizar Tasas en Vivo</button>
  </div>

  <!-- PESTAÑAS -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-conv" onclick="switchTab('conv')">Conversor</button>
    <button class="tab-btn" id="tab-com" onclick="switchTab('com')">Comisiones</button>
  </div>

  <!-- MONTO A CONVERTIR -->
  <div class="card" id="sec-conversor">
    <div class="section-title">MONTO A CONVERTIR</div>
    <div class="input-group">
      <label>Moneda de Origen</label>
      <select id="src-curr" onchange="calculate()">
        <option value="usd">Dólar BCV (USD)</option>
        <option value="eur">Euro BCV (EUR)</option>
        <option value="usdt">Tether (USDT)</option>
        <option value="ves">Bolívares (VES)</option>
      </select>
    </div>
    <div class="input-group">
      <label>Monto</label>
      <input type="number" id="amount" value="100" oninput="calculate()">
    </div>

    <div class="section-title" style="margin-top: 20px;">RESULTADOS EQUIVALENTES</div>
    <div class="res-row"><span>Bolívares (VES):</span><span class="res-val" id="res-ves">0.00</span></div>
    <div class="res-row"><span>Dólar BCV:</span><span class="res-val" id="res-usd">0.00 $</span></div>
    <div class="res-row"><span>Euro BCV:</span><span class="res-val" id="res-eur">0.00 €</span></div>
    <div class="res-row"><span>USDT:</span><span class="res-val" id="res-usdt">0.00 USDT</span></div>
  </div>

  <!-- COMISIONES -->
  <div class="card" id="sec-comisiones" style="display: none;">
    <div class="section-title">CÁLCULO DE COMISIONES</div>
    <div class="input-group">
      <label>Monto Base (VES)</label>
      <input type="number" id="com-amount" value="1000" oninput="calcCommissions()">
    </div>
    <div class="res-row"><span>Pago Móvil (0.3%):</span><span class="res-val" id="com-pm">0.00 VES</span></div>
    <div class="res-row"><span>IGTF / Divisas (3%):</span><span class="res-val" id="com-igtf">0.00 VES</span></div>
    <div class="res-row"><span>Total con Pago Móvil:</span><span class="res-val" id="com-tot-pm">0.00 VES</span></div>
  </div>
</div>

<script>
  let rates = { usd: 0, eur: 0, usdt: 0 };

  async function fetchRates() {
    try {
      // API de DolarApi Venezuela (HTTPS Segura)
      const res = await fetch('https://ve.dolarapi.com/v1/dolares');
      const data = await res.json();
      
      const bcv = data.find(item => item.fuente === 'oficial') || data[0];
      const paralelos = data.find(item => item.fuente === 'paralelo') || data[1];

      rates.usd = bcv ? bcv.promedio : 36.5;
      rates.eur = rates.usd * 1.08; 
      rates.usdt = paralelos ? paralelos.promedio : 38.2;

      document.getElementById('r-usd').innerText = rates.usd.toFixed(2);
      document.getElementById('r-eur').innerText = rates.eur.toFixed(2);
      document.getElementById('r-usdt').innerText = rates.usdt.toFixed(2);

      calculate();
    } catch (e) {
      alert("No se pudieron obtener las tasas automáticas. Verifique su conexión.");
    }
  }

  function calculate() {
    const amt = parseFloat(document.getElementById('amount').value) || 0;
    const curr = document.getElementById('src-curr').value;

    let ves = 0;
    if (curr === 'ves') ves = amt;
    else if (curr === 'usd') ves = amt * rates.usd;
    else if (curr === 'eur') ves = amt * rates.eur;
    else if (curr === 'usdt') ves = amt * rates.usdt;

    document.getElementById('res-ves').innerText = ves.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " VES";
    document.getElementById('res-usd').innerText = (rates.usd ? (ves / rates.usd).toFixed(2) : '0.00') + " $";
    document.getElementById('res-eur').innerText = (rates.eur ? (ves / rates.eur).toFixed(2) : '0.00') + " €";
    document.getElementById('res-usdt').innerText = (rates.usdt ? (ves / rates.usdt).toFixed(2) : '0.00') + " USDT";
  }

  function calcCommissions() {
    const amt = parseFloat(document.getElementById('com-amount').value) || 0;
    const pm = amt * 0.003;
    const igtf = amt * 0.03;

    document.getElementById('com-pm').innerText = pm.toFixed(2) + " VES";
    document.getElementById('com-igtf').innerText = igtf.toFixed(2) + " VES";
    document.getElementById('com-tot-pm').innerText = (amt + pm).toFixed(2) + " VES";
  }

  function switchTab(tab) {
    document.getElementById('sec-conversor').style.display = tab === 'conv' ? 'block' : 'none';
    document.getElementById('sec-comisiones').style.display = tab === 'com' ? 'block' : 'none';
    document.getElementById('tab-conv').classList.toggle('active', tab === 'conv');
    document.getElementById('tab-com').classList.toggle('active', tab === 'com');
  }

  // Carga inicial
  fetchRates();
</script>
</body>
</html>
