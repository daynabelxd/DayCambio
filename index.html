<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DayCambio</title>
  
  <!-- PWA & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #58a6ff;
    }

    .card {
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #58a6ff;
      margin-bottom: 12px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      background: #010409;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #58a6ff;
    }

    .result-box {
      background: #161b22;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #30363d;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .result-row.total {
      border-top: 1px solid #30363d;
      padding-top: 8px;
      margin-bottom: 0;
      font-weight: 700;
      color: #3fb950;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>DayCambio</h1>
    </header>

    <!-- Calculadora con Tarifas del BCV -->
    <div class="card">
      <div class="card-title">Calculadora de Comisiones</div>

      <div class="input-group">
        <label for="inputMonto">Monto de la Operación (Bs.):</label>
        <input type="number" id="inputMonto" placeholder="0.00" oninput="calcular()">
      </div>

      <div class="input-group">
        <label for="tipoOperacion">Tipo de Operación:</label>
        <select id="tipoOperacion" onchange="calcular()">
          <option value="P2P">Pago Móvil P2P (0.30% - mín. Bs. 14,00)</option>
          <option value="P2C">Pago Móvil P2C (1.50% - mín. Bs. 14,00)</option>
          <option value="C2P">Pago Móvil C2P (1.75% - mín. Bs. 14,00)</option>
          <option value="REVERSO">Operación Fallida / Reverso (Bs. 14,00)</option>
        </select>
      </div>

      <div class="result-box">
        <div class="result-row">
          <span>Monto Base:</span>
          <span id="lblMonto">0,00 Bs.</span>
        </div>
        <div class="result-row">
          <span>Comisión BCV:</span>
          <span id="lblComision">0,00 Bs.</span>
        </div>
        <div class="result-row total">
          <span>Total:</span>
          <span id="lblTotal">0,00 Bs.</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Tarifario BCV con mínimo de Bs. 14,00
    const TARIFAS = {
      P2P: { porcentaje: 0.003, minimo: 14.00 },
      P2C: { porcentaje: 0.015, minimo: 14.00 },
      C2P: { porcentaje: 0.0175, minimo: 14.00 },
      REVERSO: { fijo: 14.00 }
    };

    function calcular() {
      const monto = parseFloat(document.getElementById('inputMonto').value) || 0;
      const tipo = document.getElementById('tipoOperacion').value;

      let comision = 0;

      if (tipo === 'REVERSO') {
        comision = TARIFAS.REVERSO.fijo;
      } else if (monto > 0) {
        const tarifa = TARIFAS[tipo];
        const calculada = monto * tarifa.porcentaje;
        // Aplica Math.max para garantizar la comisión mínima de Bs. 14,00
        comision = Math.max(calculada, tarifa.minimo);
      }

      const total = monto + comision;

      document.getElementById('lblMonto').innerText = formatoBS(monto);
      document.getElementById('lblComision').innerText = formatoBS(comision);
      document.getElementById('lblTotal').innerText = formatoBS(total);
    }

    function formatoBS(monto) {
      return monto.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Bs.';
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
